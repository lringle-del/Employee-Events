<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Winter Holiday Parties · Above &amp; Beyond ABA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/lib/dashboard-shared.js"></script>
<script src="/lib/winter-shared.js"></script>
<style>
  :root{
    --vanilla:#f5f0e5; --parchment:#ebd1ab;
    --frost:#2f8fc9; --sky:#8abaff; --lagoon:#457acc; --midnight:#1c458c;
    --ink:#1c458c; --muted:#5f6b7a; --line:#e3d6bd; --white:#ffffff;
    --green:#2f9e6f; --amber:#c98a1a; --clay:#de5730;
    --shadow:0 1px 2px rgba(28,69,140,.08),0 8px 24px rgba(28,69,140,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--vanilla);color:var(--ink);line-height:1.5}
  a{color:var(--lagoon)}
  .hidden{display:none!important}
  h1,h2{font-family:'Libre Caslon Display',Georgia,serif;font-weight:400}
  .btn{font-family:inherit;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--white);color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
  .btn:hover{background:var(--parchment)}
  .btn.primary{background:linear-gradient(135deg,var(--sky),var(--frost));color:#fff;border:none}
  .btn.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line)}
  .lnk{background:none;border:none;color:var(--lagoon);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:0}

  /* ===== sign-in gate ===== */
  .gate-box{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 26px;max-width:380px;margin:60px auto}
  .gate-box h2{margin:0 0 6px}
  .gate-box .f{margin-bottom:14px}
  .gate-box .f label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin-bottom:4px}
  .gate-box .f input{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fffdf8}
  .gate-err{color:var(--clay);font-size:13px;margin-top:10px}
  .sub{color:var(--muted);font-size:14px}

  /* ===== shell: sidebar + main ===== */
  .layout{display:flex;min-height:100vh;align-items:stretch}
  .sidebar{width:220px;flex:none;background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:4px}
  .sidebar-logo{padding:4px 10px 18px}
  .sidebar-logo .name{font-family:'Fredoka','Inter',sans-serif;font-weight:600;font-size:18px;color:#141414;line-height:1.2}
  .sidebar-logo .tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:2px}
  .sidenav-item{display:flex;align-items:center;gap:9px;text-align:left;text-decoration:none;width:100%;font-family:inherit;font-size:14px;font-weight:700;border:none;background:none;color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer;box-sizing:border-box}
  .sidenav-item:hover{background:var(--vanilla)}
  .sidenav-item.active{background:var(--midnight);color:#fff}
  .sidenav-item .count{margin-left:auto;background:var(--clay);color:#fff;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px}
  .sidenav-item.active .count{background:rgba(255,255,255,.25)}
  .sidebar-sep{height:1px;background:var(--line);margin:12px 4px}
  .sidebar-foot{margin-top:auto;padding:10px;font-size:12.5px;color:var(--muted)}
  .sidebar-foot a{display:block;margin-top:8px;font-weight:700;text-decoration:none;font-size:13px}
  .main{flex:1;min-width:0;padding:26px 30px 60px}
  .main-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .main-head h1{font-size:28px;margin:0}

  /* ===== stats bar ===== */
  .stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .tile{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
  .tile .v{font-family:'Libre Caslon Display',Georgia,serif;font-size:28px;margin-top:4px}
  .tile.accent{background:linear-gradient(135deg,#ffb254,var(--clay));border:none}
  .tile.accent .k{color:#ffe9d8}
  .tile.accent .v{color:#fff}

  /* ===== toolbar / filters ===== */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input[type=search]{font-family:inherit;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--white);min-width:220px;box-shadow:var(--shadow)}
  .filter-tabs{display:flex;gap:6px;flex-wrap:wrap}
  .filter-tab{font-family:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--white);color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer}
  .filter-tab.active{background:var(--midnight);border-color:var(--midnight);color:#fff}

  /* ===== location table ===== */
  .loc-table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .loc-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;padding:11px 16px;border-bottom:2px solid var(--parchment);background:#faf6ee}
  .loc-table td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  .loc-table tr:last-child td{border-bottom:none}
  .loc-row{cursor:pointer}
  .loc-row:hover td{background:#fffdf8}
  .loc-name{font-weight:700;font-size:15px}
  .loc-sub{font-size:12px;color:var(--muted)}
  .badge{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;display:inline-block}
  .badge.confirmed{background:#dcf2e6;color:#1f7a56}
  .badge.tbd{background:#fdeccd;color:#9a6b12}
  .badge.gift{background:#ffe6c9;color:#9a5a12}
  .badge.needs{background:var(--clay);color:#fff}
  .badge.noroster{background:#fdeccd;color:#9a6b12}
  .badge.sent{background:var(--green);color:#fff}
  .chev-cell{color:var(--muted);text-align:right}
  .empty{padding:30px;text-align:center;color:var(--muted);background:var(--white);border:1px solid var(--line);border-radius:14px}

  /* ===== modal (location detail) ===== */
  .backdrop{position:fixed;inset:0;background:rgba(28,69,140,.34);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:50;overflow:auto}
  .backdrop.show{display:flex}
  .modal{background:var(--vanilla);border-radius:18px;max-width:780px;width:100%;box-shadow:0 24px 70px rgba(28,69,140,.35);overflow:hidden}
  .m-head{background:linear-gradient(135deg,var(--frost),var(--lagoon));color:#fff;padding:20px 24px 0;position:relative}
  .m-head .x{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:9px;font-size:18px;cursor:pointer}
  .m-head h2{color:#fff;font-size:26px;margin:0}
  .m-tabs{display:flex;gap:4px;margin-top:16px}
  .m-tabs button{font-family:inherit;font-size:13.5px;font-weight:700;border:none;background:rgba(255,255,255,.14);color:#dcecfb;padding:9px 16px;border-radius:9px 9px 0 0;cursor:pointer;display:flex;align-items:center;gap:6px}
  .m-tabs button.active{background:var(--vanilla);color:var(--ink)}
  .tab-badge{background:var(--clay);color:#fff;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px}
  .m-body{padding:22px 24px 26px;max-height:70vh;overflow:auto}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;margin-bottom:14px}
  .f label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin-bottom:3px}
  .f input{width:100%;font-family:inherit;font-size:13.5px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fffdf8}
  .row-upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--parchment);margin-top:6px}
  .row-upload .info{font-size:13px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px}
  .flyer-thumb{height:40px;border-radius:7px;border:1px solid var(--line)}

  /* ===== email cards (reused in modal + templates box) ===== */
  .em{background:#fffdf8;border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
  .em-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--parchment);flex-wrap:wrap}
  .em-h .dot{width:9px;height:9px;border-radius:50%}
  .dot.pl{background:var(--lagoon)}.dot.att{background:var(--frost)}
  .em-h .name{font-weight:800;font-size:13px}
  .em-h .to{font-size:11.5px;color:var(--muted)}
  .st{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;margin-left:auto}
  .c-needs{background:#fdeccd;color:#9a6b12}
  .c-appr{background:#dcf2e6;color:#1f7a56}
  .c-sched{background:#e4edfb;color:#457acc}
  .c-due{background:var(--clay);color:#fff}
  .c-sent{background:var(--green);color:#fff}
  .c-skip{background:#e6e9ee;color:var(--muted)}
  .em-body{padding:11px 14px}
  .edit-label{font-size:11.5px;font-weight:700;color:var(--amber);margin-bottom:6px}
  .em-body input.subj{width:100%;font-family:inherit;font-size:13px;font-weight:600;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--white)}
  .em-body textarea{width:100%;font-family:inherit;font-size:12.5px;line-height:1.5;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--white);min-height:130px;resize:vertical;color:var(--ink)}
  .em-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}
  .foot-note{font-size:11.5px;color:var(--muted);margin-left:auto}

  /* ===== access box (owner-only) ===== */
  .access-box{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 20px;margin:0 0 18px}
  .access-box .al{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin-bottom:8px}
  .access-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13.5px}
  .access-row .lnk{color:var(--clay)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--midnight);color:#fff;padding:13px 20px;border-radius:12px;font-size:13.5px;box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:80;max-width:520px;display:none}
  .toast.show{display:block}

  @media(max-width:860px){
    .layout{flex-direction:column}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px}
    .sidebar-logo,.sidebar-foot{display:none}
    .main{padding:18px}
    .stats-bar{grid-template-columns:repeat(2,1fr)}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="gate-box" id="gate">
  <h2>Admin sign-in</h2>
  <div class="sub" style="margin-bottom:16px">This page is limited to approved admins. Enter your email and the dashboard passcode.</div>
  <div class="f"><label>Email</label><input type="email" id="gateEmail" placeholder="you@abtaba.com" onkeydown="if(event.key==='Enter')tryGate()"></div>
  <div class="f"><label>Passcode</label><input type="password" id="gatePass" onkeydown="if(event.key==='Enter')tryGate()"></div>
  <button class="btn primary" onclick="tryGate()">Continue</button>
  <div class="gate-err" id="gateErr"></div>
</div>

<div class="layout hidden" id="shell">
  <aside class="sidebar">
    <div class="sidebar-logo"><img src="/logo.svg" alt="Above &amp; Beyond ABA Therapy" style="width:100%;max-width:170px;height:auto;display:block"><div class="tag">Admin</div></div>
    <a class="sidenav-item" href="./winter.html">❄️ Winter Holiday Parties</a>
    <div class="sidebar-sep"></div>
    <button class="sidenav-item active" id="nav-locations" onclick="setPanel('locations')">📍 Locations</button>
    <button class="sidenav-item" id="nav-wording" onclick="setPanel('wording')">✉️ Email Wording</button>
    <button class="sidenav-item hidden" id="nav-access" onclick="setPanel('access')">👤 Access</button>
    <div class="sidebar-sep"></div>
    <div class="sidebar-foot">
      <div id="whoami"></div>
    </div>
  </aside>
  <main class="main">
    <div id="panel-locations">
      <div class="main-head"><h1>Locations</h1></div>
      <div class="stats-bar" id="statsBar"></div>
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search by city or state…" oninput="renderTable()">
        <div class="filter-tabs" id="filterTabs"></div>
      </div>
      <div id="locTable"></div>
    </div>
    <div id="panel-wording" class="hidden">
      <div class="main-head"><h1>Email Wording</h1></div>
      <div id="templatesBox"></div>
    </div>
    <div id="panel-access" class="hidden">
      <div class="main-head"><h1>Access</h1></div>
      <div id="accessBox"></div>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="listFile" accept=".xlsx,.xls,.csv" style="display:none">
<input type="file" id="flyerFile" accept="image/jpeg,image/png" style="display:none">

<script>
const T0 = today0();
const OWNER_EMAIL = "lringle@abtaba.com";
let ADMIN_EMAIL = null;
let ADMINS = [];
let openId = null, modalTab = "details";
let curPanel = "locations";
let FILTER = "all";

/* ===== sign-in gate ===== */
function enterApp(email){
  ADMIN_EMAIL=email;
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("shell").classList.remove("hidden");
  if(email===OWNER_EMAIL) document.getElementById("nav-access").classList.remove("hidden");
  document.getElementById("whoami").innerHTML=`Signed in as<br><b>${esc(email)}</b><br><button class="lnk" onclick="signOut()">Sign out</button>`;
  load();
}
function signOut(){
  localStorage.removeItem("admin_email");
  localStorage.removeItem("send_pass");
  location.reload();
}
async function tryGate(){
  const email=document.getElementById("gateEmail").value.trim().toLowerCase();
  const pass=document.getElementById("gatePass").value;
  const err=document.getElementById("gateErr");
  err.textContent="";
  if(!email||!email.includes("@")){ err.textContent="Enter a valid email."; return; }
  if(!pass){ err.textContent="Enter the passcode."; return; }
  try{
    const res=await fetch("/api/winter-events",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":pass},body:JSON.stringify({action:"checkAdmin",email})});
    const j=await res.json().catch(()=>({}));
    if(res.status===401){ err.textContent="Incorrect passcode."; return; }
    if(!res.ok){ err.textContent=j.error||"Something went wrong."; return; }
    if(!j.allowed){ err.textContent="This email doesn't have admin access."; return; }
    localStorage.setItem("send_pass",pass);
    localStorage.setItem("admin_email",email);
    enterApp(email);
  }catch(e){ err.textContent="Couldn't reach the server ("+e.message+")."; }
}
async function checkGate(){
  const email=localStorage.getItem("admin_email");
  const pass=localStorage.getItem("send_pass");
  if(!email||!pass) return;
  try{
    const res=await fetch("/api/winter-events",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":pass},body:JSON.stringify({action:"checkAdmin",email})});
    const j=await res.json().catch(()=>({}));
    if(!res.ok||!j.allowed){ localStorage.removeItem("admin_email"); localStorage.removeItem("send_pass"); return; }
    enterApp(email);
  }catch{}
}

/* ===== sidebar navigation ===== */
function setPanel(p){
  curPanel=p;
  ["locations","wording","access"].forEach(x=>{
    document.getElementById("panel-"+x).classList.toggle("hidden",x!==p);
    document.getElementById("nav-"+x).classList.toggle("active",x===p);
  });
}

/* ===== access management (owner only) ===== */
async function loadAdmins(){
  if(ADMIN_EMAIL!==OWNER_EMAIL) return;
  try{
    const res=await fetch("/api/winter-events",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":localStorage.getItem("send_pass")},body:JSON.stringify({action:"listAdmins",requesterEmail:ADMIN_EMAIL})});
    const j=await res.json().catch(()=>({}));
    if(res.ok) ADMINS=j.admins||[];
  }catch{}
}
async function addAdmin(){
  const inp=document.getElementById("newAdminEmail");
  const email=inp.value.trim().toLowerCase();
  if(!email||!email.includes("@")){ toast("Enter a valid email."); return; }
  try{
    const res=await fetch("/api/winter-events",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":localStorage.getItem("send_pass")},body:JSON.stringify({action:"addAdmin",requesterEmail:ADMIN_EMAIL,email})});
    const j=await res.json().catch(()=>({}));
    if(res.ok){ ADMINS=j.admins||[]; inp.value=""; renderAccessBox(); toast("✓ Added "+email); }
    else toast("Couldn't add: "+(j.error||("HTTP "+res.status)));
  }catch(e){ toast("Couldn't reach the server ("+e.message+")."); }
}
async function removeAdmin(email){
  if(!confirm("Remove "+email+"'s admin access?")) return;
  try{
    const res=await fetch("/api/winter-events",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":localStorage.getItem("send_pass")},body:JSON.stringify({action:"removeAdmin",requesterEmail:ADMIN_EMAIL,email})});
    const j=await res.json().catch(()=>({}));
    if(res.ok){ ADMINS=j.admins||[]; renderAccessBox(); toast("Removed."); }
    else toast("Couldn't remove: "+(j.error||("HTTP "+res.status)));
  }catch(e){ toast("Couldn't reach the server ("+e.message+")."); }
}
function renderAccessBox(){
  const host=document.getElementById("accessBox");
  if(!host) return;
  if(ADMIN_EMAIL!==OWNER_EMAIL){ host.innerHTML=""; return; }
  host.innerHTML=`<div class="access-box">
    <div class="al">Who has admin access</div>
    ${ADMINS.map(e=>`<div class="access-row">${esc(e)}${e===OWNER_EMAIL?' <span style="color:var(--muted);font-size:12px">(owner)</span>':` <button class="lnk access-row" style="font-size:12.5px" onclick="removeAdmin('${esc(e)}')">remove</button>`}</div>`).join("")}
    <div style="display:flex;gap:8px;margin-top:10px">
      <input id="newAdminEmail" type="email" placeholder="name@abtaba.com" style="flex:1;font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px">
      <button class="btn" onclick="addAdmin()">+ Add</button>
    </div>
  </div>`;
}

/* ===== load + refresh ===== */
async function load(){
  await Promise.all([loadEvents(),loadPLs(),loadDirectors(),loadSchedule(),loadAudiences(),loadRsvpCounts(),loadAdmins(),loadTemplateOverrides()]);
  renderAccessBox();
  renderTemplatesBox();
  renderFilterTabs();
  renderTable();
  if(openId) renderModal();
}
function refreshAll(){ renderFilterTabs(); renderTable(); if(openId) renderModal(); }

/* ===== email wording: per-location Save / Save-for-all, sample send ===== */
async function applyToAll(eventId,key,scope){
  const e=WINTER_EVENTS.find(x=>x.id===eventId);
  const subj=document.getElementById("subj:"+eventId+":"+key).value, body=document.getElementById("body:"+eventId+":"+key).value;
  const name=winterReminders(e).find(x=>x.key===key).name;
  const msg = scope==='one'
    ? `Save this wording for ${e.city||e.state}'s "${name}" email only?`
    : `Apply this wording to every location's "${name}" email?\n\nThis updates the default text for every location that hasn't been approved yet. Already-approved or sent emails are not changed.`;
  if(!confirm(msg)) return;
  const pass=getSendPass(); if(!pass){ toast("Passcode needed."); return; }
  try{
    const res=await fetch("/api/winter-events",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":pass},body:JSON.stringify({action:"saveTemplateOverride",key,sourceEventId:eventId,subject:subj,body,scope})});
    const j=await res.json().catch(()=>({}));
    if(res.ok){ TEMPLATE_OVERRIDES=j.overrides||{}; refreshAll(); renderTemplatesBox(); toast(scope==='one'?"✓ Saved.":"✓ Applied to all locations."); }
    else if(res.status===401){ localStorage.removeItem("send_pass"); toast("Incorrect passcode — try again."); }
    else toast("Couldn't save: "+(j.error||("HTTP "+res.status)));
  }catch(err){ toast("Couldn't reach the server ("+err.message+")."); }
}
const TEMPLATE_KINDS=[
  {key:'invite',kind:'att',name:'Invite + RSVP'},
  {key:'nudge',kind:'att',name:"RSVP nudge (to people who haven't answered)"},
  {key:'att7',kind:'att',name:'Attendee reminder — 1 week before'},
  {key:'att1',kind:'att',name:'Attendee reminder — 1 day before'},
  {key:'pl3',kind:'pl',name:'Party Lead reminder — 3 days before'},
];
function renderTemplatesBox(){
  const host=document.getElementById("templatesBox");
  if(!host) return;
  const blocks=TEMPLATE_KINDS.map(tk=>{
    const t=placeholderTemplate({key:tk.key,kind:tk.kind});
    return `<div class="em">
      <div class="em-h"><span class="dot ${tk.kind}"></span><span class="name">${esc(tk.name)}</span></div>
      <div class="em-body">
        <div class="edit-label">✏️ Edit this wording, then save -- the bracketed placeholders get replaced with each location's own info automatically</div>
        <input class="subj" id="tsubj:${tk.key}" value="${esc(t.subject)}">
        <textarea id="tbody:${tk.key}">${esc(t.body)}</textarea>
        <div class="em-foot"><button class="btn primary" onclick="saveTemplateFromEditor('${tk.key}')">🌍 Save for all locations</button><span class="foot-note">Only updates drafts that haven't been approved yet</span></div>
      </div>
    </div>`;
  }).join("");
  host.innerHTML=`<div class="sub" style="margin-bottom:14px">Edit any email below and save -- it becomes the default text for that email at every location. (To change the wording for just one location instead, open that location and edit it there.)</div>${blocks}`;
}
async function saveTemplateFromEditor(key){
  const subj=document.getElementById("tsubj:"+key).value, body=document.getElementById("tbody:"+key).value;
  const name=TEMPLATE_KINDS.find(k=>k.key===key).name;
  if(!confirm(`Save this wording as the default for every location's "${name}" email?\n\nThis updates everywhere that hasn't been approved yet.`)) return;
  const pass=getSendPass(); if(!pass){ toast("Passcode needed."); return; }
  try{
    const res=await fetch("/api/winter-events",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":pass},body:JSON.stringify({action:"saveTemplateOverride",key,subject:subj,body,scope:"all"})});
    const j=await res.json().catch(()=>({}));
    if(res.ok){ TEMPLATE_OVERRIDES=j.overrides||{}; refreshAll(); renderTemplatesBox(); toast("✓ Saved — applied to all locations."); }
    else if(res.status===401){ localStorage.removeItem("send_pass"); toast("Incorrect passcode — try again."); }
    else toast("Couldn't save: "+(j.error||("HTTP "+res.status)));
  }catch(err){ toast("Couldn't reach the server ("+err.message+")."); }
}
async function sendSample(eventId,key){
  const subj=document.getElementById("subj:"+eventId+":"+key).value, body=document.getElementById("body:"+eventId+":"+key).value;
  const pass=getSendPass(); if(!pass){ toast("Passcode needed."); return; }
  toast("Sending sample…");
  try{
    const res=await fetch("/api/send",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":pass},body:JSON.stringify({subject:"SAMPLE: "+subj,text:body,to:[ADMIN_EMAIL]})});
    const j=await res.json().catch(()=>({}));
    if(res.ok) toast("✓ Sample sent to "+ADMIN_EMAIL+".");
    else if(res.status===401){ localStorage.removeItem("send_pass"); toast("Incorrect passcode — try again."); }
    else toast("Couldn't send: "+(j.error||("HTTP "+res.status)));
  }catch(err){ toast("Couldn't reach the server ("+err.message+")."); }
}

/* ===== event field editing (same backend calls as before) ===== */
async function patchEvent(id, fields){
  const pass=getSendPass(); if(!pass){ toast("Passcode needed."); return false; }
  try{
    const res=await fetch("/api/winter-events",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":pass},body:JSON.stringify({id,...fields})});
    const j=await res.json().catch(()=>({}));
    if(res.ok){ const i=WINTER_EVENTS.findIndex(x=>x.id===id); if(i>=0) WINTER_EVENTS[i]=j.event; return true; }
    if(res.status===401){ localStorage.removeItem("send_pass"); toast("Incorrect passcode — try again."); }
    else toast("Couldn't save: "+(j.error||("HTTP "+res.status)));
  }catch(err){ toast("Couldn't reach the server ("+err.message+")."); }
  return false;
}
function fmtClock(hm){ if(!hm) return ""; const [h,m]=hm.split(":").map(Number); const ap=h>=12?"PM":"AM"; let hh=h%12; if(hh===0) hh=12; return hh+":"+String(m).padStart(2,"0")+" "+ap; }
async function saveDateTime(id){
  const date=document.getElementById("edate:"+id).value||null;
  const st=document.getElementById("etstart:"+id).value, et=document.getElementById("etend:"+id).value;
  const time=(st&&et)?(fmtClock(st)+"–"+fmtClock(et)):(st?fmtClock(st):null);
  const startISO=(date&&st)?date+"T"+st+":00":null;
  const endISO=(date&&et)?date+"T"+et+":00":null;
  if(await patchEvent(id,{date,time,startISO,endISO})){ refreshAll(); toast("Saved ✓"); }
}
async function saveTextField(id,field){
  const val=document.getElementById("e"+field+":"+id).value.trim();
  if(await patchEvent(id,{[field]:val})) toast("Saved ✓");
}
async function saveBcc(id){
  const raw=document.getElementById("ebcc:"+id).value;
  const list=raw.split(",").map(s=>s.trim()).filter(Boolean);
  if(await patchEvent(id,{extraBcc:list})) toast("Saved ✓");
}
async function saveBudget(id,field,val){
  const n=val===""?null:Number(val);
  if(await patchEvent(id,{[field]:n})){ refreshAll(); toast("Saved ✓"); }
}
async function savePL(id){
  const name=document.getElementById("plname:"+id).value, email=document.getElementById("plemail:"+id).value.trim();
  const pass=getSendPass(); if(!pass){ toast("Passcode needed."); return; }
  SERVER_PLS[id]={name,email};
  try{ await fetch("/api/pl",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":pass},body:JSON.stringify({eventId:id,name,email})}); toast("Saved ✓"); }catch{}
}
async function saveDirector(id){
  const email=document.getElementById("direml:"+id).value.trim();
  const pass=getSendPass(); if(!pass){ toast("Passcode needed."); return; }
  SERVER_DIRECTORS[id]=email;
  try{ await fetch("/api/director",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":pass},body:JSON.stringify({eventId:id,email})}); refreshAll(); toast("Saved ✓"); }catch{}
}

/* ===== roster / flyer upload ===== */
function extractEmailsFromWorkbook(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
  const out=new Set(); const rx=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  if(!rows.length) return [];
  const header=rows[0].map(h=>String(h).toLowerCase().trim());
  let emailCol=header.indexOf("email");
  if(emailCol<0) emailCol=header.findIndex(h=>h.includes("email")&&!h.includes("additional")&&!h.includes("guardian"));
  if(emailCol<0){ rows.forEach(r=>r.forEach(c=>{const v=String(c).trim(); if(rx.test(v))out.add(v);})); return [...out]; }
  for(let i=1;i<rows.length;i++){ const em=String(rows[i][emailCol]||"").trim(); if(rx.test(em)) out.add(em); }
  return [...out];
}
function uploadList(eventId){
  const e=WINTER_EVENTS.find(x=>x.id===eventId);
  const inp=document.getElementById("listFile");
  inp.value="";
  inp.onchange=async()=>{
    const file=inp.files[0]; if(!file) return;
    toast("Reading "+file.name+"…");
    let emails;
    try{ const data=await file.arrayBuffer(); const wb=XLSX.read(data,{type:"array"}); emails=extractEmailsFromWorkbook(wb); }
    catch(err){ toast("Couldn't read that file ("+err.message+")."); return; }
    if(!emails.length){ toast("No email addresses found in that file."); return; }
    if(!confirm(`Save ${emails.length} emails as the ${e.city||e.state} winter roster?`)) return;
    const pass=getSendPass(); if(!pass){ toast("Passcode needed to save the list."); return; }
    toast("Saving "+emails.length+" emails…");
    try{
      const res=await fetch("/api/audience",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":pass},body:JSON.stringify({label:"Winter "+e.label,emails})});
      const j=await res.json().catch(()=>({}));
      if(res.ok){ AUD_COUNTS["Winter "+e.label]=j.count; toast(`✓ Saved ${j.count} emails for ${e.city||e.state}.`); refreshAll(); }
      else if(res.status===401){ localStorage.removeItem("send_pass"); toast("Incorrect passcode — try again."); }
      else toast("Save failed: "+(j.error||("HTTP "+res.status)));
    }catch(err){ toast("Couldn't reach the server ("+err.message+")."); }
  };
  inp.click();
}
function uploadFlyer(eventId){
  const inp=document.getElementById("flyerFile");
  inp.value="";
  inp.onchange=async()=>{
    const file=inp.files[0]; if(!file) return;
    toast("Processing "+file.name+"…");
    try{
      const url=URL.createObjectURL(file);
      const img=new Image();
      await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
      const maxW=700;
      const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      const base64=canvas.toDataURL("image/jpeg",0.78).split(",")[1];
      const pass=getSendPass(); if(!pass){ toast("Passcode needed."); return; }
      toast("Uploading flyer…");
      const res=await fetch("/api/winter-events",{method:"POST",headers:{"content-type":"application/json","x-send-passcode":pass},body:JSON.stringify({id:eventId,action:"uploadFlyer",imageBase64:base64,contentType:"image/jpeg"})});
      const j=await res.json().catch(()=>({}));
      if(res.ok){ const i=WINTER_EVENTS.findIndex(x=>x.id===eventId); if(i>=0) WINTER_EVENTS[i].flyerUrl=j.flyerUrl; toast("✓ Flyer uploaded."); refreshAll(); }
      else if(res.status===401){ localStorage.removeItem("send_pass"); toast("Incorrect passcode — try again."); }
      else toast("Upload failed: "+(j.error||("HTTP "+res.status)));
    }catch(err){ toast("Couldn't process that image ("+err.message+")."); }
  };
  inp.click();
}

/* ===== email section (used inside the modal's Emails tab) ===== */
function needsApprovalCount(e){
  return winterReminders(e).filter(r=>{ const s=getStatus(e.id,r.key); return s==="draft"||s==="preview"||s==="scheduled"; }).length;
}
function emailSection(e){
  const pl=getPL(e.id), dir=getDirector(e.id);
  const rs=winterReminders(e);
  return rs.map(r=>{
    const t=template(e,r);
    const status=getStatus(e.id,r.key);
    const st=statusPill(status,r.date);
    const ac=audienceCount(e.label);
    const toDetail = r.kind==="pl" ? (pl.email?esc(pl.email):'<span style="color:var(--amber)">assign a PL email above</span>')+(dir?(" · bcc "+esc(dir)):"") : ((r.onlyNonResponders?("about "+nudgeLeft(e)+" who haven't answered yet"):((ac!=null?ac:0)+" recipients"))+((r.key==="att7"||r.key==="att1")&&dir?(" · bcc "+esc(dir)):""));
    const applyBtn=`<button class="btn ghost" onclick="applyToAll('${e.id}','${r.key}','one')" title="Save this wording for ${esc(e.city||e.state)} only">💾 Save</button><button class="btn ghost" onclick="applyToAll('${e.id}','${r.key}','all')" title="Use this wording as the default for every location's ${r.name}">🌍 Save for all locations</button>`;
    const sampleBtn=`<button class="btn ghost" onclick="sendSample('${e.id}','${r.key}')" title="Email yourself a copy of this exact text">📧 Send me a sample</button>`;
    let controls;
    if(status==="draft"){
      controls=`<button class="btn primary" onclick="approveFor('${e.id}','${r.key}')">✓ Approve &amp; schedule</button>
        ${applyBtn}${sampleBtn}
        <button class="btn ghost" onclick="copyMail('${e.id}','${r.key}')">Copy</button>
        <button class="lnk" onclick="skipFor('${e.id}','${r.key}')">Ignore</button>
        <span class="foot-note">Not scheduled</span>`;
    }else if(status==="scheduled"||status==="preview"||status==="confirmed"){
      const note = status==="confirmed" ? "✓ Approved — will send "+fmtShort(r.date)+"." : status==="preview" ? "📨 Preview sent — approve it" : "✓ Scheduled — tap Approve & send to release it.";
      const approveBtn = status!=="confirmed" ? `<button class="btn primary" onclick="confirmSendFor('${e.id}','${r.key}')">✅ Approve &amp; send</button>` : "";
      controls=`${approveBtn}${applyBtn}${sampleBtn}<button class="btn ghost" onclick="copyMail('${e.id}','${r.key}')">Copy</button><button class="lnk" onclick="revokeFor('${e.id}','${r.key}')">Revoke</button><span class="foot-note">${note}</span>`;
    }else if(status==="sent"){
      controls=`${sampleBtn}<button class="btn ghost" onclick="copyMail('${e.id}','${r.key}')">Copy</button><span class="foot-note">✓ Sent</span>`;
    }else{
      controls=`<button class="lnk" onclick="restoreFor('${e.id}','${r.key}')">Restore</button><span class="foot-note">Ignored</span>`;
    }
    return `<div class="em">
      <div class="em-h">
        <span class="dot ${r.kind}"></span>
        <span class="name">${r.name}</span>
        <span class="to">→ ${toDetail} · sends ${fmtShort(r.date)}</span>
        <span class="st ${st.cls}">${st.txt}</span>
      </div>
      <div class="em-body">
        <div class="edit-label">✏️ Edit the text below if you'd like to change the wording</div>
        <input class="subj" id="subj:${e.id}:${r.key}" value="${esc(t.subject)}">
        <textarea id="body:${e.id}:${r.key}">${esc(t.body)}</textarea>
        <div class="em-foot">${controls}</div>
      </div>
    </div>`;
  }).join("");
}

/* ===== location status + filters ===== */
function statusFor(e){
  if(e.giftOnly) return "gift";
  if(!e.date) return "nodate";
  if(needsApprovalCount(e)>0) return "needs";
  const rs=winterReminders(e);
  if(rs.length && rs.every(r=>getStatus(e.id,r.key)==="sent")) return "sent";
  return "scheduled";
}
const FILTERS=[
  {key:"all",label:"All"},
  {key:"needs",label:"Needs approval"},
  {key:"nodate",label:"No date yet"},
  {key:"scheduled",label:"Scheduled"},
  {key:"sent",label:"Fully sent"},
  {key:"gift",label:"Gift only"},
];
function setFilter(f){ FILTER=f; renderFilterTabs(); renderTable(); }
function renderFilterTabs(){
  const host=document.getElementById("filterTabs");
  if(!host) return;
  host.innerHTML=FILTERS.map(f=>{
    const n=WINTER_EVENTS.filter(e=>f.key==="all"||statusFor(e)===f.key).length;
    return `<button class="filter-tab${FILTER===f.key?' active':''}" onclick="setFilter('${f.key}')">${f.label} (${n})</button>`;
  }).join("");
}
function renderStats(){
  const host=document.getElementById("statsBar");
  if(!host) return;
  const parties=WINTER_EVENTS.filter(e=>!e.giftOnly);
  const approvedLocations=parties.filter(e=>{ const s=statusFor(e); return s==="scheduled"||s==="sent"; }).length;
  let emailsSent=0, emailsNeeding=0;
  parties.forEach(e=>{
    winterReminders(e).forEach(r=>{
      const s=getStatus(e.id,r.key);
      if(s==="sent") emailsSent++;
      else if(s==="draft"||s==="preview"||s==="scheduled") emailsNeeding++;
    });
  });
  const noDate=WINTER_EVENTS.filter(e=>statusFor(e)==="nodate").length;
  host.innerHTML=`
    <div class="tile"><div class="k">Locations approved</div><div class="v">${approvedLocations} / ${parties.length}</div></div>
    <div class="tile"><div class="k">Emails sent</div><div class="v">${emailsSent}</div></div>
    <div class="tile${emailsNeeding>0?' accent':''}"><div class="k">Emails need approval</div><div class="v">${emailsNeeding}</div></div>
    <div class="tile"><div class="k">No date yet</div><div class="v">${noDate}</div></div>`;
}
function statusBadges(e){
  const dateBadge = e.giftOnly ? `<span class="badge gift">Gift only</span>` : (e.date ? `<span class="badge confirmed">Date confirmed</span>` : `<span class="badge tbd">Date TBD</span>`);
  const ac=audienceCount(e.label);
  const rosterBadge = ac==null ? `<span class="badge noroster">No list</span>` : "";
  const need=needsApprovalCount(e);
  const needBadge = need>0 ? `<span class="badge needs">${need} need${need===1?'s':''} approval</span>` : "";
  const st=statusFor(e);
  const sentBadge = st==="sent" ? `<span class="badge sent">All sent</span>` : "";
  return dateBadge+rosterBadge+needBadge+sentBadge;
}
function renderTable(){
  renderStats();
  const q=(document.getElementById("search").value||"").trim().toLowerCase();
  let rows=WINTER_EVENTS.slice();
  if(FILTER!=="all") rows=rows.filter(e=>statusFor(e)===FILTER);
  if(q) rows=rows.filter(e=>(e.city||"").toLowerCase().includes(q)||(e.state||"").toLowerCase().includes(q));
  rows.sort((a,b)=>(a.state||"").localeCompare(b.state||""));
  const host=document.getElementById("locTable");
  if(!rows.length){ host.innerHTML=`<div class="empty">No locations match.</div>`; return; }
  host.innerHTML=`<table class="loc-table"><thead><tr><th>Location</th><th>Date</th><th>RSVPs</th><th>Status</th><th></th></tr></thead><tbody>
    ${rows.map(e=>{
      const rc=e.giftOnly?null:rsvpCount(e.id);
      const dateTxt = e.giftOnly ? "—" : (e.date ? fmtShort(ymd(e.date)) : "TBD");
      const rsvpTxt = rc ? `${rc.total}${e.est?" / "+e.est:""}` : "—";
      return `<tr class="loc-row" onclick="openLocation('${e.id}')">
        <td><div class="loc-name">${esc(e.city||e.state)}</div><div class="loc-sub">${esc(e.state)}${e.venue?" · "+esc(e.venue):""}</div></td>
        <td>${dateTxt}</td>
        <td>${rsvpTxt}</td>
        <td>${statusBadges(e)}</td>
        <td class="chev-cell">›</td>
      </tr>`;
    }).join("")}
  </tbody></table>`;
}

/* ===== location detail modal ===== */
function openLocation(id){
  openId=id; modalTab="details";
  renderModal();
  document.getElementById("backdrop").classList.add("show");
  document.body.style.overflow="hidden";
}
function closeModal(){
  document.getElementById("backdrop").classList.remove("show");
  document.body.style.overflow="";
  openId=null;
  renderTable();
}
function setModalTab(t){ modalTab=t; renderModal(); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&openId) closeModal(); });

function renderModal(){
  const e=WINTER_EVENTS.find(x=>x.id===openId);
  if(!e) return;
  const pl=getPL(e.id), dir=getDirector(e.id);
  const ac=audienceCount(e.label);
  const need=needsApprovalCount(e);

  const dateFields = e.giftOnly ? "" : `<div class="grid2">
      <div class="f"><label>Date</label><input type="date" id="edate:${e.id}" value="${e.date||""}" onchange="saveDateTime('${e.id}')"></div>
      <div class="f"><label>Start / End time</label><div style="display:flex;gap:6px">
        <input type="time" id="etstart:${e.id}" value="${e.startISO?e.startISO.split('T')[1].slice(0,5):""}" onchange="saveDateTime('${e.id}')">
        <input type="time" id="etend:${e.id}" value="${e.endISO?e.endISO.split('T')[1].slice(0,5):""}" onchange="saveDateTime('${e.id}')">
      </div></div>
      <div class="f"><label>Venue</label><input id="evenue:${e.id}" value="${esc(e.venue||"")}" placeholder="Venue name" onchange="saveTextField('${e.id}','venue')"></div>
      <div class="f"><label>Address</label><input id="eaddress:${e.id}" value="${esc(e.address||"")}" placeholder="Street address" onchange="saveTextField('${e.id}','address')"></div>
      <div class="f" style="grid-column:1 / -1"><label>Website</label><input id="eurl:${e.id}" value="${esc(e.url||"")}" placeholder="https://..." onchange="saveTextField('${e.id}','url')"></div>
    </div>`;

  const detailsTab = `
    ${dateFields}
    <div class="grid2">
      <div class="f"><label>Party Lead name</label><input id="plname:${e.id}" value="${esc(pl.name||"")}" placeholder="Name" onchange="savePL('${e.id}')"></div>
      <div class="f"><label>Party Lead email</label><input id="plemail:${e.id}" type="email" value="${esc(pl.email||"")}" placeholder="name@abtaba.com" onchange="savePL('${e.id}')"></div>
      <div class="f"><label>State director (BCC)</label><input id="direml:${e.id}" type="email" value="${esc(dir)}" placeholder="name@abtaba.com" onchange="saveDirector('${e.id}')"></div>
      <div class="f"><label>Other BCC (comma-separated)</label><input id="ebcc:${e.id}" value="${esc((e.extraBcc||[]).join(', '))}" placeholder="name@abtaba.com, name2@abtaba.com" onchange="saveBcc('${e.id}')"></div>
    </div>
    <div class="grid2">
      <div class="f"><label>Budget allotted</label><input type="number" value="${e.budgetAllotted??''}" placeholder="0" onchange="saveBudget('${e.id}','budgetAllotted',this.value)"></div>
      <div class="f"><label>Budget spent</label><input type="number" value="${e.budgetSpent??0}" placeholder="0" onchange="saveBudget('${e.id}','budgetSpent',this.value)"></div>
    </div>
    <div class="row-upload">
      <div class="info">📋 ${ac!=null?`<b>${ac}</b> emails uploaded`:"No list uploaded yet"}</div>
      <button class="btn" onclick="uploadList('${e.id}')">⬆ Upload list</button>
    </div>
    <div class="row-upload">
      <div class="info">${e.flyerUrl?`<img src="${esc(e.flyerUrl)}" class="flyer-thumb"> Flyer uploaded`:"No flyer uploaded yet"}</div>
      <button class="btn" onclick="uploadFlyer('${e.id}')">⬆ Upload flyer</button>
    </div>`;

  const emailsTab = e.giftOnly
    ? `<div style="font-size:13px;color:var(--muted)">No automated email for gift-only locations.</div>`
    : emailSection(e);

  const tabs = e.giftOnly ? "" : `<div class="m-tabs">
      <button class="${modalTab==='details'?'active':''}" onclick="setModalTab('details')">Details</button>
      <button class="${modalTab==='emails'?'active':''}" onclick="setModalTab('emails')">Emails${need>0?` <span class="tab-badge">${need}</span>`:''}</button>
    </div>`;

  document.getElementById("modal").innerHTML=`
    <div class="m-head">
      <button class="x" onclick="closeModal()">×</button>
      <h2>${esc(e.city||e.state)}</h2>
      ${tabs}
    </div>
    <div class="m-body">${e.giftOnly ? detailsTab+emailsTab : (modalTab==='details'?detailsTab:emailsTab)}</div>`;
}

function toast(msg){const t=document.getElementById("toast");t.innerHTML=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),6000);}

checkGate();
